<div class="modal-backdrop" *ngIf="isOpen" (click)="onClose()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <header class="modal-header">
      <h3 class="modal-title">Change Payment Method</h3>
      <button type="button" class="close-btn" (click)="onClose()" aria-label="Close modal">
        <svg lucideX [size]="22"></svg>
      </button>
    </header>

    <div class="modal-body">
      <div class="option-grid option-grid--2">
        <button type="button" class="option-card option-card--pay" [class.selected]="paymentMethod() === 'cod'"
          (click)="selectPayment('cod')">
          <span class="pay-icon">
            <svg lucideBanknote [size]="20"></svg>
          </span>
          <div class="pay-text">
            <div class="pay-title">Cash on Delivery</div>
            <div class="pay-caption">Pay when you receive items</div>
          </div>
          <span class="option-card__radio">
            <svg *ngIf="paymentMethod() === 'cod'" lucideCheck [size]="14"></svg>
          </span>
        </button>

        <button type="button" class="option-card option-card--pay" [class.selected]="paymentMethod() === 'qr'"
          (click)="selectPayment('qr')">
          <span class="pay-icon">
            <svg lucideQrCode [size]="20"></svg>
          </span>
          <div class="pay-text">
            <div class="pay-title">QR Code</div>
            <div class="pay-caption">Scan &amp; pay with your app</div>
          </div>
          <span class="option-card__radio">
            <svg *ngIf="paymentMethod() === 'qr'" lucideCheck [size]="14"></svg>
          </span>
        </button>

        <button type="button" class="option-card option-card--pay" [class.selected]="paymentMethod() === 'bank_transfer'"
          (click)="selectPayment('bank_transfer')">
          <span class="pay-icon">
            <svg lucideLandmark [size]="20"></svg>
          </span>
          <div class="pay-text">
            <div class="pay-title">Bank Transfer</div>
            <div class="pay-caption">Secure internet banking</div>
          </div>
          <span class="option-card__radio">
            <svg *ngIf="paymentMethod() === 'bank_transfer'" lucideCheck [size]="14"></svg>
          </span>
        </button>

        <button type="button" class="option-card option-card--pay" [class.selected]="paymentMethod() === 'card'"
          (click)="selectPayment('card')">
          <span class="pay-icon">
            <svg lucideCreditCard [size]="20"></svg>
          </span>
          <div class="pay-text">
            <div class="pay-title">Credit / Debit Card</div>
            <div class="pay-caption">Visa, Mastercard, NAPAS</div>
          </div>
          <span class="option-card__radio">
            <svg *ngIf="paymentMethod() === 'card'" lucideCheck [size]="14"></svg>
          </span>
        </button>
      </div>

      <!-- Inline Form for Bank Transfer -->
      <div class="card-item-form-container bank-transfer-form" *ngIf="paymentMethod() === 'bank_transfer'">
        <div class="form-header-row">
          <div class="header-left">
            <span class="card-icon-box">
              <svg lucideLandmark [size]="18"></svg>
            </span>
            <span class="form-title-text">Bank Transfer</span>
          </div>
        </div>

        <div class="inline-form-fields">
          <div class="inline-field">
            <label>ACCOUNT HOLDER NAME</label>
            <input type="text" [(ngModel)]="bankForm.cardholder_name" id="change-bank-holder-name" placeholder="Full Name"
              (blur)="formatBankholderName()" />
            <div id="change-bank-holder-name-error" class="field-error animate-fade-in"></div>
          </div>
          <div class="inline-field">
            <label>CARD NUMBER</label>
            <div class="input-with-icon">
              <input type="text" [(ngModel)]="bankForm.card_number" id="change-bank-num" placeholder="2345 3859 2952 5871"
                (blur)="formatBankNumber()" />
              <img src="assets/images/payment_napas.png" class="inline-brand-icon" />
            </div>
            <div id="change-bank-num-error" class="field-error animate-fade-in"></div>
          </div>
          <div class="inline-row-fields">
            <div class="inline-field">
              <label>EXPIRY DATE</label>
              <input type="text" [(ngModel)]="bankForm.expire_date" id="change-bank-expiry" placeholder="MM / YY" />
              <div id="change-bank-expiry-error" class="field-error animate-fade-in"></div>
            </div>
            <div class="inline-field">
              <label>ISSUED BANK</label>
              <input type="text" [(ngModel)]="bankForm.issued_bank" id="change-bank-issued" placeholder="Vietcombank"
                list="change-vietnam-banks" />
              <datalist id="change-vietnam-banks">
                <option *ngFor="let bank of bankList" [value]="bank">{{ bank }}</option>
              </datalist>
              <div id="change-bank-issued-error" class="field-error animate-fade-in"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Inline Form for Credit / Debit Card (guests or no saved cards) -->
      <div class="card-item-form-container credit-card-form" *ngIf="paymentMethod() === 'card' && savedCards().length === 0">
        <div class="form-header-row">
          <div class="header-left">
            <span class="card-icon-box">
              <svg lucideCreditCard [size]="18"></svg>
            </span>
            <span class="form-title-text">Credit / Debit Card</span>
          </div>
        </div>

        <div class="form-tabs-control">
          <button type="button" class="tab-btn" [class.active]="cardForm.card_type === 'credit'"
            (click)="cardForm.card_type = 'credit'; clearCardErrors()">
            CREDIT / DEBIT CARD
          </button>
          <button type="button" class="tab-btn" [class.active]="cardForm.card_type === 'NAPAS'"
            (click)="cardForm.card_type = 'NAPAS'; clearCardErrors()">
            BANKING TRANSFER
          </button>
        </div>

        <div class="inline-form-fields">
          <div class="inline-field">
            <label>CARDHOLDER NAME</label>
            <input type="text" [(ngModel)]="cardForm.cardholder_name" id="change-card-holder-name" placeholder="Full Name"
              (blur)="formatCardholderName()" />
            <div id="change-card-holder-name-error" class="field-error animate-fade-in"></div>
          </div>
          <div class="inline-field">
            <label>CARD NUMBER</label>
            <div class="input-with-icon">
              <input type="text" [(ngModel)]="cardForm.card_number" id="change-card-num" placeholder="2345 3859 2952 5871"
                (blur)="formatCardNumber()" />
              <img *ngIf="inlineCardBrand === 'Visa'" src="assets/images/payment_visa.png" class="inline-brand-icon" />
              <img *ngIf="inlineCardBrand === 'Mastercard'" src="assets/images/payment_mastercard.png" class="inline-brand-icon" />
              <img *ngIf="inlineCardBrand === 'Napas'" src="assets/images/payment_napas.png" class="inline-brand-icon" />
            </div>
            <div id="change-card-num-error" class="field-error animate-fade-in"></div>
          </div>
          <div class="inline-row-fields">
            <div class="inline-field">
              <label>EXPIRY DATE</label>
              <input type="text" [(ngModel)]="cardForm.expire_date" id="change-card-expiry" placeholder="MM / YY" />
              <div id="change-card-expiry-error" class="field-error animate-fade-in"></div>
            </div>
            <div class="inline-field">
              <label *ngIf="cardForm.card_type !== 'NAPAS'">CVV</label>
              <label *ngIf="cardForm.card_type === 'NAPAS'">ISSUED BANK</label>
              <input *ngIf="cardForm.card_type !== 'NAPAS'" type="text" [(ngModel)]="cardForm.cvc" id="change-card-cvc" placeholder="941" />
              <input *ngIf="cardForm.card_type === 'NAPAS'" type="text" [(ngModel)]="cardForm.issued_bank" id="change-card-bank"
                placeholder="Vietcombank" list="change-vietnam-banks" />
              <datalist id="change-vietnam-banks">
                <option *ngFor="let bank of bankList" [value]="bank">{{ bank }}</option>
              </datalist>
              <div id="change-card-cvc-error" class="field-error animate-fade-in"></div>
              <div id="change-card-bank-error" class="field-error animate-fade-in"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Saved Cards list for logged-in users -->
      <div *ngIf="paymentMethod() === 'card' && authService.isAuthenticated() && savedCards().length > 0"
        class="saved-resources-list saved-cards-list">
        <div *ngFor="let card of savedCards()" class="resource-card card-item"
          [class.selected]="!showInlineCardForm() && selectedCardId() === card._id"
          [class.expired]="isCardExpired(card.expire_date)"
          (click)="selectSavedCard(card)">
          <div class="card-radio">
            <span class="radio-dot" [class.active]="!showInlineCardForm() && selectedCardId() === card._id">
              <svg *ngIf="!showInlineCardForm() && selectedCardId() === card._id" lucideCheck [size]="12"></svg>
            </span>
          </div>

          <div class="card-thumbnail">
            <img [src]="getCardThumbnail(card)" [alt]="getCardBrand(card)" />
          </div>

          <div class="card-content">
            <div class="card-header-row">
              <span class="card-logo-name">{{ getCardLabel(card) }}</span>
              <span class="badge badge-expired" *ngIf="isCardExpired(card.expire_date)">Expired</span>
            </div>
            <div class="card-detail card-expiry">Expires {{ card.expire_date }}</div>
            <div class="card-default-text" *ngIf="card.is_default">Default</div>
          </div>
          <div class="card-actions">
            <button type="button" class="action-btn delete-btn" (click)="deleteCard(card, $event)" aria-label="Delete card">
              <svg lucideTrash2 [size]="20"></svg>
            </button>
          </div>
        </div>

        <div class="resource-card card-item add-card-trigger" (click)="openAddCardModal()" *ngIf="!showInlineCardForm()">
          <div class="card-radio">
            <span class="radio-dot"></span>
          </div>
          <div class="card-content">
            <span class="add-card-text">Add New Card</span>
          </div>
        </div>

        <!-- Inline Add New Card Form -->
        <div class="card-item-form-container" *ngIf="showInlineCardForm()">
          <div class="form-header-row">
            <div class="header-left">
              <span class="card-icon-box">
                <svg lucideCreditCard [size]="18"></svg>
              </span>
              <span class="form-title-text">Add New Card</span>
            </div>
          </div>

          <div class="form-tabs-control">
            <button type="button" class="tab-btn" [class.active]="cardForm.card_type === 'credit'"
              (click)="cardForm.card_type = 'credit'; clearCardErrors()">
              CREDIT / DEBIT CARD
            </button>
            <button type="button" class="tab-btn" [class.active]="cardForm.card_type === 'NAPAS'"
              (click)="cardForm.card_type = 'NAPAS'; clearCardErrors()">
              BANKING TRANSFER
            </button>
          </div>

          <div class="inline-form-fields">
            <div class="inline-field">
              <label>CARDHOLDER NAME</label>
              <input type="text" [(ngModel)]="cardForm.cardholder_name" id="change-card-holder-name" placeholder="Full Name"
                (blur)="formatCardholderName()" />
              <div id="change-card-holder-name-error" class="field-error animate-fade-in"></div>
            </div>
            <div class="inline-field">
              <label>CARD NUMBER</label>
              <div class="input-with-icon">
                <input type="text" [(ngModel)]="cardForm.card_number" id="change-card-num" placeholder="2345 3859 2952 5871"
                  (blur)="formatCardNumber()" />
                <img *ngIf="inlineCardBrand === 'Visa'" src="assets/images/payment_visa.png" class="inline-brand-icon" />
                <img *ngIf="inlineCardBrand === 'Mastercard'" src="assets/images/payment_mastercard.png" class="inline-brand-icon" />
                <img *ngIf="inlineCardBrand === 'Napas'" src="assets/images/payment_napas.png" class="inline-brand-icon" />
              </div>
              <div id="change-card-num-error" class="field-error animate-fade-in"></div>
            </div>
            <div class="inline-row-fields">
              <div class="inline-field">
                <label>EXPIRY DATE</label>
                <input type="text" [(ngModel)]="cardForm.expire_date" id="change-card-expiry" placeholder="MM / YY" />
                <div id="change-card-expiry-error" class="field-error animate-fade-in"></div>
              </div>
              <div class="inline-field">
                <label *ngIf="cardForm.card_type !== 'NAPAS'">CVV</label>
                <label *ngIf="cardForm.card_type === 'NAPAS'">ISSUED BANK</label>
                <input *ngIf="cardForm.card_type !== 'NAPAS'" type="text" [(ngModel)]="cardForm.cvc" id="change-card-cvc" placeholder="941" />
                <input *ngIf="cardForm.card_type === 'NAPAS'" type="text" [(ngModel)]="cardForm.issued_bank" id="change-card-bank"
                  placeholder="Vietcombank" list="change-vietnam-banks" />
                <div id="change-card-cvc-error" class="field-error animate-fade-in"></div>
                <div id="change-card-bank-error" class="field-error animate-fade-in"></div>
              </div>
            </div>
          </div>

          <div class="inline-form-actions">
            <button type="button" class="btn btn-primary btn-save-new-card" [disabled]="!isCardFormValid || loading()" (click)="saveCard()">
              ADD CARD
            </button>
            <button type="button" class="btn btn-secondary btn-cancel-card" (click)="cancelAddCard()">
              CANCEL
            </button>
          </div>
        </div>
      </div>

      <div *ngIf="errorMessage()" class="form-error-banner animate-fade-in">{{ errorMessage() }}</div>
    </div>

    <footer class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="onClose()">CANCEL</button>
      <button type="button" class="btn btn-primary" [disabled]="isConfirmDisabled" (click)="confirm()">
        <span *ngIf="!loading()">CONFIRM PAYMENT METHOD</span>
        <span *ngIf="loading()">SAVING...</span>
      </button>
    </footer>
  </div>
</div>
