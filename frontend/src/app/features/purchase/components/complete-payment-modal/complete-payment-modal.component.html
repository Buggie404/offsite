<div class="modal-overlay animate-fade-in">
  <div class="modal-container animate-scale-up">
    <!-- Close button -->
    <button class="modal-close-btn" (click)="onClose()" aria-label="Close modal">
      <svg lucideX [size]="20" class="close-icon"></svg>
    </button>

    <!-- Wallet Icon Wrapper -->
    <div class="wallet-circle-wrapper">
      <svg lucideWallet [size]="24" class="wallet-icon"></svg>
    </div>

    <!-- Title -->
    <h2 class="modal-title font-body">Complete Payment</h2>

    <!-- Description -->
    <p class="modal-desc font-body">
      You’re just one click away from your daily ritual. We’ve kept your order ready so you can pick up right where you left off. Secure your blend now before it rests.
    </p>

    <!-- Actions -->
    <div class="modal-actions">
      <button class="modal-btn-primary font-body" (click)="onRetry()">
        SAME PAYMENT METHOD
      </button>
      <button class="modal-btn-secondary font-body" (click)="onChangeMethod()">
        CHANGE PAYMENT METHOD
      </button>
    </div>

    <!-- Footer footnote -->
    <div class="modal-footer font-mono">
      © Offsite 2026 · Ho Chi Minh City, Vietnam
    </div>
  </div>
</div>
