@if (currentCategoryData) {
  <app-category-hero
    [title]="currentCategoryData.title"
    [description]="currentCategoryData.description"
    [bgColor]="currentCategoryData.bgColor"
    [imageSrc]="currentCategoryData.imageSrc"
    [textColor]="currentCategoryData.textColor"
    [descColor]="currentCategoryData.descColor"
  ></app-category-hero>

  <!-- Catalog: Sidebar Filters + Product Grid + Pagination -->
  <app-category-catalog [category]="currentCategorySlug"></app-category-catalog>

} @else {
  <div class="category-not-found">
    <h2>Category not found</h2>
  </div>
}

<app-back-to-top></app-back-to-top>
