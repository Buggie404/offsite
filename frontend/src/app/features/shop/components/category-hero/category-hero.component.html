<section class="category-hero" [ngClass]="variant ? 'category-hero--' + variant : ''" [ngStyle]="{'background-color': bgColor}">
  <span class="category-hero__decor category-hero__decor--sage" aria-hidden="true"></span>
  <span class="category-hero__decor category-hero__decor--ring" aria-hidden="true"></span>
  <span class="category-hero__decor category-hero__decor--plus" aria-hidden="true"></span>
  <span class="category-hero__decor category-hero__decor--plus-sm" aria-hidden="true"></span>
  <span class="category-hero__decor category-hero__decor--diamond" aria-hidden="true"></span>
  <span class="category-hero__decor category-hero__decor--diamond-sm" aria-hidden="true"></span>
  <span class="category-hero__decor category-hero__decor--bar" aria-hidden="true"></span>
  <span class="category-hero__decor category-hero__decor--pixel-trail" aria-hidden="true"></span>
  <span class="category-hero__decor category-hero__decor--geo-burst" aria-hidden="true"></span>
  <span class="category-hero__decor category-hero__decor--solid-square" aria-hidden="true"></span>
  <span class="category-hero__decor category-hero__decor--solid-triangle" aria-hidden="true"></span>
  <div class="category-hero__container" [class.no-image]="!imageSrc">
    <div class="category-hero__content">
      <h1 class="category-hero__title" [ngStyle]="textColor ? {'color': textColor} : {}">{{ title }}</h1>
      <p class="category-hero__description" *ngIf="description" [ngStyle]="descColor ? {'color': descColor} : {}">{{ description }}</p>
    </div>
    
    <div class="category-hero__image-wrapper" *ngIf="imageSrc">
      <div class="category-hero__image-placeholder">
        <img [src]="imageSrc" [alt]="title" class="category-hero__image" />
      </div>
    </div>
  </div>
</section>
