<section class="collection-section">

  <!-- Background decorations -->
  <div class="geo geo--dots-tr" aria-hidden="true"></div>
  <div class="geo geo--dots-bl" aria-hidden="true"></div>
  <div class="geo geo--ring" aria-hidden="true"></div>
  <div class="geo geo--ring-dashed" aria-hidden="true"></div>
  <div class="geo geo--blob-sage" aria-hidden="true"></div>
  <div class="geo geo--blob-blush" aria-hidden="true"></div>
  <div class="geo geo--diamond" aria-hidden="true"></div>
  <div class="geo geo--diamond-sm" aria-hidden="true"></div>
  <div class="geo geo--plus" aria-hidden="true"></div>
  <div class="geo geo--plus-sm" aria-hidden="true"></div>
  <div class="geo geo--dot-blush" aria-hidden="true"></div>
  <div class="geo geo--dot-forest" aria-hidden="true"></div>
  <div class="geo geo--line" aria-hidden="true"></div>

  <!-- ── HEADER ── -->
  <div class="section-header reveal-fade-in" appAnimateInView>
    <div class="eyebrow-row">
      <div class="eyebrow-divider"></div>
      <span class="eyebrow-label">Browse by Collection</span>
    </div>
    <h2 class="section-heading">Find your ritual</h2>
  </div>

  <!-- ── COLLECTIONS GRID ── -->
  <div class="collections-grid reveal-fade-in-stagger" appAnimateInView>

    <!-- ROW 1: Large cards (Matcha + Coffee) -->
    <div class="row-large">
      <a
        *ngFor="let item of largeCollections"
        [class]="'card card-large ' + item.id"
        [routerLink]="['/shop', item.id]"
        [attr.aria-label]="'Shop ' + item.name"
      >
        <div class="card-content">
          <h3 class="card-title">{{ item.name }}</h3>
          <p class="card-desc">{{ item.description }}</p>
        </div>

        <div class="card-img">
          <img [src]="item.image" [alt]="item.imageAlt" />
        </div>

        <div class="card-footer">
          <span class="card-count">{{ formatCount(item.productCount, item.productLabel) }}</span>
        </div>
      </a>
    </div>

    <!-- ROW 2: Small cards (Tools + Drinkware + Bundles) -->
    <div class="row-small">
      <a
        *ngFor="let item of smallCollections"
        [class]="'card card-small ' + item.id"
        [routerLink]="['/shop', item.id]"
        [attr.aria-label]="'Shop ' + item.name"
      >
        <span class="card-title">{{ item.name }}</span>

        <div class="card-img">
          <img [src]="item.image" [alt]="item.imageAlt" />
        </div>

        <div class="card-footer">
          <span class="card-count">{{ formatCount(item.productCount, item.productLabel) }}</span>
        </div>
      </a>
    </div>

  </div>

</section>
