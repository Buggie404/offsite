<section class="community-section">

  <!-- Background decorations -->
  <div class="geo geo--ring" [appParallax]="0.15" aria-hidden="true"></div>
  <div class="geo geo--ring-dashed" [appParallax]="-0.18" aria-hidden="true"></div>
  <div class="geo geo--blob" [appParallax]="0.1" aria-hidden="true"></div>
  <div class="geo geo--diamond" [appParallax]="0.22" aria-hidden="true"></div>
  <div class="geo geo--dot" [appParallax]="0.28" aria-hidden="true"></div>
  <div class="geo geo--dot-sm" [appParallax]="-0.22" aria-hidden="true"></div>

  <div class="container">
    <div class="community-header reveal-fade-in" appAnimateInView>
      <h2>You make it look good.</h2>
    </div>

    <div class="community-grid" appDragScroll appAnimateInView>
      <div class="community-card" *ngFor="let card of cards" [style.background-color]="card.bgColor"
           (click)="onCardClick(card)">
        <div class="card-image">
          <ng-container *ngIf="card.mediaType === 'video'; else imageMedia">
            <video [src]="card.image" preload="metadata" muted playsinline
              (error)="setFallbackMedia(card)"></video>
            <div class="video-play-indicator" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z" />
              </svg>
            </div>
          </ng-container>
          <ng-template #imageMedia>
          <img [src]="card.image" [alt]="'Post by ' + card.community_name"
            (error)="setFallbackMedia(card)">
          </ng-template>
        </div>
        <div class="card-content">
          <p class="username">{{ card.community_name }}</p>
          <p class="description">{{ card.preview }}</p>
          <div class="likes">
            <!-- Inline SVG heart – không cần Lucide dependency -->
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"
              class="heart-icon">
              <path
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
            </svg>
            <span>{{ card.likes }} likes</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Banner CTA – "SHARE YOUR BREW" chưa link đến đâu, sẽ nối với trang community sau -->
  <div class="container container--banner">
    <div class="community-banner">
      <h3>Join the movement</h3>
      <button class="btn-primary" (click)="onShareBrew()">SHARE YOUR BREW</button>
    </div>
  </div>
</section>
