<!-- ─────────────────────────────────────────────────────────────
     components/recipe-section/recipe-section.component.html
───────────────────────────────────────────────────────────── -->

<section class="brew-section" [class.brew-section--compact]="compact">

  <!-- Background geometric decorations -->
  <div class="geo geo--circle" [appParallax]="0.1" aria-hidden="true"></div>
  <div class="geo geo--dots" [appParallax]="-0.14" aria-hidden="true"></div>
  <div class="geo geo--dots-left" [appParallax]="0.16" aria-hidden="true"></div>

  <div class="brew-container">

    <!-- ── HEADING ─────────────────────────────────────────── -->
    <div class="section-header reveal-fade-in" appAnimateInView>
      <div class="heading-block">
        <h2 class="heading-block__title">{{ sectionHeading }}</h2>
        <hr class="heading-block__divider" />
      </div>
      <a routerLink="/recipes" class="view-all-link" *ngIf="showViewAll">
        <span>VIEW ALL RECIPES</span>
        <svg lucideArrowRight [size]="16" aria-hidden="true"></svg>
      </a>
    </div>

    <!-- ── LOADING STATE ───────────────────────────────────── -->
    <div *ngIf="isLoading" class="loading-row">
      <div class="skeleton-card" *ngFor="let i of [1,2,3]">
        <div class="skeleton-card__image"></div>
        <div class="skeleton-card__body">
          <div class="skeleton-line skeleton-line--short"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line skeleton-line--long"></div>
        </div>
      </div>
    </div>

    <!-- ── CARD GRID ────────────────────────────────────────── -->
    <div *ngIf="!isLoading" class="card-grid" appDragScroll appAnimateInView>

      <article
        class="recipe-card"
        *ngFor="let recipe of recipes; let i = index"
        [routerLink]="['/recipes', recipe.slug]"
        [state]="detailLinkState"
        role="link"
        tabindex="0"
      >
        <!-- Image area -->
        <div class="recipe-card__image-wrapper">
          <span class="badge" [style.background]="getBadgeColor(recipe)">
            {{ getBadgeLabel(recipe) }}
          </span>
          <button
            type="button"
            class="fav-btn"
            [class.fav-btn--active]="isSaved(recipe)"
            (click)="toggleFavorite(recipe, $event)"
            [attr.aria-label]="isSaved(recipe) ? 'Remove from saved recipes' : 'Save recipe'"
          >
            <svg lucideHeart [size]="18" class="fav-icon" [attr.fill]="isSaved(recipe) ? 'currentColor' : 'none'" aria-hidden="true"></svg>
          </button>
          <div class="recipe-card__image">
            <img
              [src]="recipe.heroImage.url"
              [alt]="recipe.title"
              loading="lazy"
              onerror="this.src='assets/images/placeholder.jpg'; this.onerror=null;"
            />
          </div>
        </div>

        <!-- Card body -->
        <div class="recipe-card__body">
          <h3 class="recipe-card__title">{{ recipe.title }}</h3>
          <hr class="recipe-card__divider" />

          <!-- Meta: base + time + difficulty + saves -->
          <div class="recipe-card__meta">
            <span class="meta-item">
              <svg lucideDroplet [size]="14" class="meta-item__icon" aria-hidden="true"></svg>
              {{ getRecipeBaseLabel(recipe) }}
            </span>
            <span class="meta-item">
              <svg lucideClock [size]="14" class="meta-item__icon" aria-hidden="true"></svg>
              {{ recipe.metadata.prepTime }} Mins
            </span>
            <span class="meta-item">
              <svg lucideStar [size]="14" class="meta-item__icon" aria-hidden="true"></svg>
              {{ getDifficultyLabel(recipe) }}
            </span>
            <span class="meta-item">
              <svg lucideHeart [size]="14" class="meta-item__icon heart-icon-spec" aria-hidden="true"></svg>
              {{ recipe.saves || 0 }}
            </span>
          </div>

          <!-- Description -->
          <p class="recipe-card__desc">{{ recipe.description }}</p>

          <!-- CTA -->
          <a [routerLink]="['/recipes', recipe.slug]" [state]="detailLinkState" class="recipe-card__cta" (click)="$event.stopPropagation()">
            <span>View Recipe</span>
            <span class="recipe-card__cta-arrow" aria-hidden="true">→</span>
          </a>
        </div>
      </article>

    </div><!-- /.card-grid -->
  </div><!-- /.brew-container -->
</section>
