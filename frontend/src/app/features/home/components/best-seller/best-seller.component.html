<!-- home/components/best-seller/best-seller.component.html -->

<section class="bestseller-section">
<div class="main-frame">

  <!-- ── HEADER ── -->
  <div class="bestsellers-header">
    <div class="header-left">
      <div class="eyebrow-row">
        <div class="divider"></div>
        <span class="eyebrow-text">Best sellers</span>
      </div>
      <h2 class="section-heading">What everyone's drinking</h2>
    </div>
    <a routerLink="/shop/best-sellers" class="view-all-link">
      <span>VIEW ALL PRODUCTS</span>
      <svg lucideArrowRight [size]="16" aria-hidden="true"></svg>
    </a>
  </div>

  <!-- ── LOADING ── -->
  <div class="loading" *ngIf="isLoading">Loading...</div>

  <!-- ── PRODUCT GRID ── -->
  <div class="product-grid" *ngIf="!isLoading">

    <div class="card" *ngFor="let product of products">

      <!-- ── IMAGE WRAP ── -->
      <div class="card-image-wrap">
        <img [src]="getPrimaryImage(product)" [alt]="getPrimaryImageAlt(product)" class="product-img" />

        <button
          type="button"
          class="save-btn"
          [class.save-btn--active]="isSaved(product)"
          (click)="onSave(product, $event)"
          [attr.aria-label]="isSaved(product) ? 'Remove from saved products' : 'Save product'"
        >
          <svg lucideHeart [size]="16" [attr.fill]="isSaved(product) ? 'currentColor' : 'none'" aria-hidden="true"></svg>
        </button>

        <span class="badge">BEST SELLER</span>
      </div>

      <!-- ── CARD BODY — flex column space-between ── -->
      <div class="card-body">

        <!-- TOP: title, origin, tags, roast bar -->
        <div class="card-body-top"
             [class.gap-coffee]="product.category === 'coffee'"
             [class.gap-bundle]="product.category === 'sets_bundles'">

          <!-- Title + Rating -->
          <div class="title-rating-row">
            <h3 class="product-title">{{ product.name }}</h3>
            <div class="rating">
              <svg viewBox="0 0 16 16">
                <polygon points="8,1 10,6 15,6 11,9.5 12.5,15 8,11.8 3.5,15 5,9.5 1,6 6,6"/>
              </svg>
              <!-- Hardcode 4.9 tạm — đổi thành product.rating_avg khi DB có data -->
              <span>4.9</span>
            </div>
          </div>

          <!-- Origin (ẩn với sets_bundles) -->
          <p class="origin-text" *ngIf="product.category !== 'sets_bundles' && getOrigin(product)">
            {{ getOrigin(product) }}
          </p>

          <!-- Tag pills -->
          <div class="tags-row" *ngIf="getTags(product).length">
            <div class="tag" *ngFor="let tag of getTags(product)">
              <span>{{ tag }}</span>
            </div>
          </div>

          <!-- Roast bar — coffee only -->
          <div class="roast-bar" *ngIf="showRoastBar(product)">
            <span
              *ngFor="let color of roastSwatches; let i = index"
              class="swatch"
              [class.swatch--highlight]="isHighlightSwatch(product, i)"
              [style.background]="isHighlightSwatch(product, i) ? '#E8E05A' : color"
            ></span>
          </div>

        </div><!-- /card-body-top -->

        <!-- BOTTOM: price + add — luôn stick đáy nhờ space-between -->
        <div class="price-add-row">
          <span class="price">{{ getPrice(product) }}</span>
          <button class="add-btn" (click)="onAddToCart(product)">
            <span>Add</span>
          </button>
        </div>

      </div><!-- /card-body -->

    </div><!-- /card -->

  </div><!-- /product-grid -->

</div>
</section>
