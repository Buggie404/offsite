<section class="hero">
  <img *ngIf="heroImage" class="hero__image" [src]="heroImage" alt="Offsite home cafe setup" />

  <div class="hero__inner">
    <div class="hero__content">
      <h1 class="hero__heading">
        {{ heading }} <span class="hero__heading-accent">{{ headingAccent }}</span>
      </h1>

      <p class="hero__body">{{ body }}</p>

      <div class="hero__cta">
        <a routerLink="/shop/best-seller" class="btn btn--dark">{{ ctaPrimary }}</a>
        <a routerLink="/shop/build-your-bundle" class="btn btn--outline">{{ ctaSecondary }}</a>
      </div>
    </div>
  </div>
</section>
