<article class="community-card" (click)="onCardClick()">

  <header class="card-header">
    <div class="author-avatar" [class.author-avatar--pink]="avatarTone === 'pink'">
      <img *ngIf="post.author.avatar_url" [src]="post.author.avatar_url" [alt]="post.author.username">
      <span *ngIf="!post.author.avatar_url">{{ initials }}</span>
    </div>
    <span class="author-name">&#64;{{ post.author.username }}</span>
    <span class="chip chip--wheat" *ngIf="post.post_type === 'recipe'">Recipe</span>
    <span class="chip chip--sage" *ngIf="!(post.post_type === 'recipe' && post.base === 'RECIPE')">{{ post.base }}</span>
    <span class="header-spacer"></span>

    <div class="card-menu-wrap">
      <button type="button" class="menu-trigger" aria-label="Post options" (click)="toggleMenu($event)">
        <svg lucideEllipsis [size]="18"></svg>
      </button>
      <div class="card-menu" *ngIf="menuOpen" (click)="$event.stopPropagation()">
        <button type="button" class="card-menu__item" (click)="onMenuSave($event)">
          <svg lucideBookmark [size]="15"></svg>
          <span>{{ post.saved ? 'Unsave post' : 'Save post' }}</span>
        </button>
        <button type="button" class="card-menu__item card-menu__item--danger" *ngIf="!isOwner" (click)="onMenuReport($event)">
          <svg lucideFlag [size]="15"></svg>
          <span>Report post</span>
        </button>
        <button type="button" class="card-menu__item card-menu__item--danger" *ngIf="isOwner" (click)="onMenuDelete($event)">
          <svg lucideTrash2 [size]="15"></svg>
          <span>Delete</span>
        </button>
      </div>
    </div>
  </header>

  <div class="card-media" [class.card-media--text]="!hasMedia" [ngClass]="!hasMedia ? 'card-media--' + (post.base | lowercase) : ''">
    <ng-container *ngIf="hasMedia; else textOnly">
      <img *ngIf="heroMedia.type === 'image'" [src]="heroMedia.url" [alt]="post.content">
      <div class="video-preview" *ngIf="heroMedia.type === 'video'">
        <video [src]="heroMedia.url" preload="metadata" muted playsinline></video>
        <div class="play-overlay">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
      </div>
    </ng-container>
    <ng-template #textOnly>
      <svg class="media-quote" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.6 6C6 7.2 3.6 10.2 3.6 14.4V19h6.6v-6H7c.2-2 1.5-3.6 3.4-4.2L9.6 6Zm10.2 0c-3.6 1.2-6 4.2-6 8.4V19h6.6v-6h-3.2c.2-2 1.5-3.6 3.4-4.2L19.8 6Z"/>
      </svg>
      <p class="media-text">{{ post.content }}</p>
    </ng-template>
  </div>

  <div class="card-body">
    <p class="card-caption" *ngIf="hasMedia && post.content">{{ post.content }}</p>

    <div class="card-actions">
      <button type="button" class="action-btn action-btn--like" [class.active]="post.liked" (click)="onLike($event)">
        <svg lucideHeart [size]="15"></svg>
        <span>{{ post.like_count || 0 }}</span>
      </button>

      <button type="button" class="action-btn" (click)="onComment($event)">
        <svg lucideMessageCircle [size]="15"></svg>
        <span>{{ post.comment_count || 0 }}</span>
      </button>

      <button type="button" class="action-btn" aria-label="Share" (click)="onShare($event)">
        <svg lucideShare2 [size]="15"></svg>
      </button>

      <span class="actions-spacer"></span>

      <button type="button" class="action-btn action-btn--save" [class.active]="post.saved" aria-label="Save" (click)="onSave($event)">
        <svg lucideBookmark [size]="15"></svg>
      </button>
    </div>
  </div>
</article>
