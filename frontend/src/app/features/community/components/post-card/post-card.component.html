<article class="community-card" [style.background]="cardColor" (click)="onCardClick()">

  <div class="card-image">


    <ng-container *ngIf="!hasMedia">
      <div class="text-fallback">
        <p class="text-fallback__content">{{ post.content }}</p>
      </div>
    </ng-container>


    <ng-container *ngIf="hasMedia && isVideo">
      <video
        class="card-video-thumb"
        [src]="image"
        preload="metadata"
        muted
        playsinline>
      </video>
      <div class="play-overlay">
        <svg
          class="play-icon"
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>
    </ng-container>

    <ng-container *ngIf="hasMedia && !isVideo">
      <img
        [src]="image"
        [alt]="post.author.username"
        (error)="onImageError($event)">
    </ng-container>

  </div>

  <div class="card-content">

    <div class="card-header">
      <p class="username">
        @{{ post.author.username }}
      </p>
      <p class="time-ago">{{ timeAgo }}</p>
    </div>

    <p class="description">
      {{ hasMedia ? preview : '' }}
    </p>

    <!-- ── Like / Comment / Share / Save — tương tác ngay trên card, không cần vào detail (trừ comment cần mở khung nhập) ── -->
    <div class="card-actions">

      <button
        type="button"
        class="action-btn action-btn--like"
        [class.active]="post.liked"
        (click)="onLike(); $event.stopPropagation()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          [attr.fill]="post.liked ? 'currentColor' : 'none'"
          stroke="currentColor"
          stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12
            5.67l-1.06-1.06a5.5
            5.5 0 0 0-7.78
            7.78l1.06
            1.06L12
            21.23l7.78-7.78
            1.06-1.06a5.5
            5.5 0 0 0
            0-7.78z"/>
        </svg>
      </button>

      <button
        type="button"
        class="action-btn action-btn--comment"
        (click)="onComment(); $event.stopPropagation()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
      </button>

      <button
        type="button"
        class="action-btn action-btn--share"
        (click)="onShare(); $event.stopPropagation()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13"/>
        </svg>
      </button>

      <button
        type="button"
        class="action-btn action-btn--save"
        [class.active]="post.saved"
        (click)="onSave(); $event.stopPropagation()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" [attr.fill]="post.saved ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
      </button>

    </div>

  </div>

</article>

<div *ngIf="showShareModal" (click)="$event.stopPropagation()">
  <app-share-modal
    [shareUrl]="shareUrl"
    (close)="closeShareModal()">
  </app-share-modal>
</div>
