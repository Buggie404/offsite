<article class="community-card" [class.text-only]="!hasMedia" [style.background]="cardColor" (click)="onCardClick()">

  <div class="card-image" *ngIf="hasMedia">
    <img *ngIf="heroMedia.type === 'image'" [src]="heroMedia.url" [alt]="post.content">
    <div class="video-preview" *ngIf="heroMedia.type === 'video'">
      <video [src]="heroMedia.url" preload="metadata" muted playsinline></video>
      <div class="play-overlay">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>
    </div>
    <div class="card-badge" *ngIf="post.post_type === 'recipe'">RECIPE</div>
  </div>

  <div class="card-content">
    
    <div class="card-header">
      <div class="author-info">
        <div class="author-avatar">
          <img *ngIf="post.author.avatar_url" [src]="post.author.avatar_url" [alt]="post.author.username">
          <span *ngIf="!post.author.avatar_url" class="avatar-fallback">
            {{ post.author.username.charAt(0) | uppercase }}
          </span>
        </div>
        <div class="author-meta">
          <span class="author-name">@{{ post.author.username }}</span>
          <span class="post-time">{{ timeAgo(post.created_at) }}</span>
        </div>
      </div>
      <div class="header-tags">
        <span class="badge-inline" *ngIf="!hasMedia && post.post_type === 'recipe'">RECIPE</span>
        <span class="base-chip" [class.base-chip--matcha]="post.base === 'MATCHA'" [class.base-chip--coffee]="post.base === 'COFFEE'">{{ post.base }}</span>
      </div>
    </div>

    <div class="post-normal-text" *ngIf="hasMedia && post.content">
      <p>{{ post.content }}</p>
    </div>

    <div class="post-text-content" *ngIf="!hasMedia">
      <p>{{ post.content }}</p>
    </div>

    <div class="card-actions">
      <button type="button" class="action-btn action-btn--like" [class.active]="post.liked" (click)="onLike($event)">
        <svg viewBox="0 0 24 24" [attr.fill]="post.liked ? 'currentColor' : 'none'">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>{{ post.like_count || 0 }}</span>
      </button>

      <button type="button" class="action-btn" (click)="onComment($event)">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>{{ post.comment_count || 0 }}</span>
      </button>

      <button type="button" class="action-btn" (click)="onShare($event)">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>{{ post.share_count || 0 }}</span>
      </button>

      <button type="button" class="action-btn action-btn--save" [class.active]="post.saved" (click)="onSave($event)">
        <svg viewBox="0 0 24 24" [attr.fill]="post.saved ? 'currentColor' : 'none'"> 
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> 
        </svg>
        <span>{{ post.save_count || 0 }}</span>
      </button>
    </div>

  </div>
</article>
