<div class="comments-section" id="comments-section">

  <div *ngIf="commentsLoading" class="comments-loading">Loading comments...</div>

  <div *ngIf="!commentsLoading && commentThreads.length === 0" class="comments-empty">
    No comments yet. Be the first to share your thoughts!
  </div>

  <div class="comment-thread" *ngFor="let comment of commentThreads">
    <ng-container *ngTemplateOutlet="commentRow; context: { $implicit: comment, isReply: false, parentId: comment.comment_id }"></ng-container>

    <div class="comment-replies" *ngIf="comment.replies.length > 0">
      <ng-container *ngFor="let reply of comment.replies">
        <ng-container *ngTemplateOutlet="commentRow; context: { $implicit: reply, isReply: true, parentId: comment.comment_id }"></ng-container>
      </ng-container>
    </div>
  </div>
</div>

<div class="comment-composer">
  <div class="composer-avatar" [class.composer-avatar--pink]="avatarTone(currentUser?.username) === 'pink'">
    <img *ngIf="currentUser?.avatar_url" [src]="currentUser.avatar_url" [alt]="currentUser.username">
    <span *ngIf="!currentUser?.avatar_url">{{ initials(currentUser?.username) }}</span>
  </div>
  <input
    type="text"
    class="composer-input"
    placeholder="Write a comment…"
    [(ngModel)]="mainCommentText"
    (keydown.enter)="submitComment(false)">
  <button type="button" class="composer-post-btn" [disabled]="!mainCommentText.trim() || postingComment" (click)="submitComment(false)">
    <svg lucideSend [size]="14"></svg>
    <span>Post</span>
  </button>
</div>

<ng-template #commentRow let-comment let-isReply="isReply" let-parentId="parentId">
  <div class="comment-item" [class.comment-item--reply]="isReply">
    <div class="comment-avatar" [class.comment-avatar--pink]="avatarTone(comment.author.username) === 'pink'">
      <img *ngIf="comment.author.avatar_url" [src]="comment.author.avatar_url" [alt]="comment.author.username">
      <span *ngIf="!comment.author.avatar_url">{{ initials(comment.author.username) }}</span>
    </div>

    <div class="comment-body">
      <div class="comment-meta">
        <span class="comment-username">&#64;{{ comment.author.username }}</span>
        <span class="author-badge" *ngIf="comment.author.is_post_author">AUTHOR</span>
        <span class="comment-time">{{ timeAgo(comment.created_at) }}</span>
        
        <div class="comment-options" *ngIf="currentUser">
           <button type="button" class="options-trigger" (click)="toggleCommentOptions(comment.comment_id, $event)">
             <svg lucideEllipsis [size]="16"></svg>
           </button>
           <div class="options-dropdown" *ngIf="showCommentOptionsFor === comment.comment_id">
             <button type="button" class="delete-action" *ngIf="isCommentAuthor(comment.user_id)" (click)="promptDeleteComment(comment.comment_id)">Delete Comment</button>
             <button type="button" class="delete-action" *ngIf="!isCommentAuthor(comment.user_id)" (click)="openReportComment(comment)">Report Comment</button>
           </div>
        </div>
      </div>

      <p class="comment-text">
        <span class="reply-to" *ngIf="isReply && comment.reply_to_username">@{{ comment.reply_to_username }}</span>
        {{ comment.content }}
      </p>

      <div class="comment-actions">
        <button type="button" class="comment-like-btn" [class.active]="isCommentLiked(comment)" (click)="toggleLikeComment(comment)">
          <svg lucideHeart [size]="12"></svg>
          <span>{{ comment.like_count }}</span>
        </button>
        <button type="button" class="comment-reply-btn" (click)="startReply(parentId, comment.comment_id, comment.author.username)">Reply</button>
      </div>

      <div class="inline-reply-box" *ngIf="replyingTo?.anchorId === comment.comment_id">
        <div class="composer-row">
          <input 
            type="text" 
            [placeholder]="'Reply to @' + replyingTo!.username + '...'" 
            [(ngModel)]="replyCommentText" 
            (keydown.enter)="submitComment(true)">
          <button type="button" class="composer-clear-btn" *ngIf="replyCommentText.trim()" (click)="replyCommentText = ''">✕</button>
          
          <button type="button" class="composer-send-btn" [disabled]="!replyCommentText.trim() || postingComment" (click)="submitComment(true)">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
              <path d="M12 16V8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M8.5 11.5L12 8L15.5 11.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </div>
</ng-template>

<app-report-post-modal
  *ngIf="reportTarget"
  target="comment"
  [authorUsername]="reportTarget.author.username"
  [postExcerpt]="reportTarget.content"
  [submitting]="reportSubmitting"
  (cancel)="closeReportComment()"
  (submitReport)="submitReportComment($event)">
</app-report-post-modal>

<app-confirmation-modal
  *ngIf="isConfirmDeleteModalOpen"
  [isOpen]="isConfirmDeleteModalOpen"
  title="Delete Comment?"
  message="Are you sure you want to delete this comment?"
  warningMessage="This action cannot be undone."
  confirmText="DELETE"
  cancelText="CANCEL"
  type="danger"
  (confirm)="confirmDeleteComment()"
  (cancel)="cancelDeleteComment()">
</app-confirmation-modal>
