<div class="share-overlay" (click)="onBackdropClick()">
  <div class="share-modal" (click)="$event.stopPropagation()">

    <button class="btn-close" type="button" (click)="onRequestClose()" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" style="fill: none;">
        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <h2 class="share-title">Share this post</h2>

    <!-- Share via social -->
    <div class="share-section">
      <p class="share-label">Share via social</p>

      <div class="social-row">

        <button class="social-btn" type="button" (click)="shareToFacebook()">
          <span class="social-icon">
            <svg width="20" height="20" viewBox="0 0 16 16" style="fill: currentColor;">
              <path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951"/>
            </svg>
          </span>
          <span class="social-label">Facebook</span>
        </button>

        <button class="social-btn" type="button" (click)="shareToWhatsApp()">
          <span class="social-icon">
            <svg width="20" height="20" viewBox="0 0 16 16" style="fill: currentColor;">
              <path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/>
            </svg>
          </span>
          <span class="social-label">WhatsApp</span>
        </button>

        <button class="social-btn" type="button" (click)="shareToX()">
          <span class="social-icon">
            <svg width="18" height="18" viewBox="0 0 16 16" style="fill: currentColor;">
              <path d="M12.6.75h2.454l-5.36 6.142L16 15.25h-4.937l-3.867-5.07-4.425 5.07H.316l5.733-6.57L0 .75h5.063l3.495 4.633L12.601.75Zm-.86 13.028h1.36L4.323 2.145H2.865z"/>
            </svg>
          </span>
          <span class="social-label">X.com</span>
        </button>

        <button class="social-btn" type="button" (click)="shareMore()">
          <span class="social-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" style="fill: currentColor;">
              <circle cx="5" cy="12" r="2"/>
              <circle cx="12" cy="12" r="2"/>
              <circle cx="19" cy="12" r="2"/>
            </svg>
          </span>
          <span class="social-label">More</span>
        </button>

      </div>
    </div>

    <!-- Story link -->
    <div class="share-section">
      <p class="share-label share-label--left">Story link</p>

      <div class="link-row">
        <input class="link-input" type="text" readonly [value]="shareUrl" (click)="copyToClipboard()" />
        <button class="btn-copy" type="button" (click)="copyToClipboard()">
          {{ copied ? 'COPIED' : 'COPY' }}
        </button>
      </div>
    </div>

    <p class="share-tagline">"{{ tagline }}"</p>

    <p class="share-footer">© Offsite 2026 · Ho Chi Minh City, Vietnam</p>

  </div>
</div>
