<section class="feed-toolbar">

  <div class="toolbar-left">
    <span class="section-label">COMMUNITY</span>
    <h1>Sip &amp; Share</h1>
  </div>

  <div class="toolbar-right">

    <div class="toolbar-actions">
      <button class="btn-create" (click)="onCreatePost()">+ CREATE POST</button>
      <button class="btn-create" (click)="onCreateRecipe()">+ CREATE RECIPE</button>
    </div>

    <div class="toolbar-filter-row">

      <div class="toolbar-filters">
        <button
          class="filter"
          [class.active]="activeCategory === ''"
          (click)="onFilterClick('')"
        >
          All Stories
        </button>
        <button
          class="filter"
          [class.active]="activeCategory === 'COFFEE'"
          (click)="onFilterClick('COFFEE')"
        >
          Coffee
        </button>
        <button
          class="filter"
          [class.active]="activeCategory === 'MATCHA'"
          (click)="onFilterClick('MATCHA')"
        >
          Matcha
        </button>
        <button
          class="filter"
          [class.active]="activeCategory === 'RECIPE'"
          (click)="onFilterClick('RECIPE')"
        >
          Recipe
        </button>
        <button
          class="filter"
          [class.active]="activeCategory === 'MY_POST'"
          (click)="onFilterClick('MY_POST')"
        >
          My Post
        </button>
      </div>

      <div class="custom-dropdown" [class.open]="isDropdownOpen">
        <div class="dropdown-trigger" (click)="toggleDropdown($event)">
          <span>{{ sort === 'created_at' ? 'Latest' : 'Trending' }}</span>
          <span class="dropdown-arrow"></span>
        </div>
        <div class="dropdown-menu" *ngIf="isDropdownOpen">
          <div 
            class="dropdown-item" 
            [class.active]="sort === 'created_at'" 
            (click)="selectSort('created_at', $event)"
          >
            Latest
          </div>
          <div 
            class="dropdown-item" 
            [class.active]="sort === 'like_count'" 
            (click)="selectSort('like_count', $event)"
          >
            Trending
          </div>
        </div>
      </div>

    </div>
  </div>

</section>
