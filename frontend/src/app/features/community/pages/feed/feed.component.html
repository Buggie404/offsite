<div class="feed-wrapper" [class.blurred]="!isLoggedIn()">
  <app-hero-banner></app-hero-banner>

  <app-feed-toolbar
      [activeCategory]="activeCategory"
      [sort]="sort"
      (createPost)="openCreatePost()"
      (createRecipe)="openCreateRecipe()"
      (categoryChange)="onCategoryChange($event)"
      (sortChange)="onSortChange($event)">
  </app-feed-toolbar>

  <section class="community-section">
      <div class="container">
          <div class="community-grid">

              <ng-container *ngIf="loading && posts.length === 0">
                  <div class="skeleton-card" *ngFor="let i of [1,2,3,4,5,6]">
                      <div class="skeleton-image"></div>
                      <div class="skeleton-content">
                          <div class="skeleton-avatar-row">
                              <div class="sk-avatar"></div>
                              <div class="sk-name"></div>
                          </div>
                          <div class="skeleton-line"></div>
                          <div class="skeleton-line short"></div>
                      </div>
                  </div>
              </ng-container>

              <app-post-card
                  *ngFor="let post of posts"
                  [post]="post"
                  (like)="likePost($event)"
                  (save)="savePost($event)"
                  (share)="sharePost($event)"
                  (openDetail)="goToDetail($event)">
              </app-post-card>

          </div>

          <div class="load-more" *ngIf="hasMore && !loading && posts.length > 0">
              <button class="btn-load" (click)="loadMore()">
                  <span>LOAD NEW POSTS</span>
                  <svg width="12" height="8" viewBox="0 0 12 8" fill="none">
                      <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
              </button>
          </div>
      </div>
  </section>
</div>

<div class="community-block-overlay" *ngIf="!isLoggedIn() && !isAuthModalOpen()">
  <div class="community-block-card">
    <div class="community-block-header">
      <img src="assets/images/logo-full-dark.svg" alt="Offsite" class="community-block-logo" />
    </div>
    <div class="community-block-body">
      <h2 class="community-block-title">JOIN OUR COMMUNITY</h2>
      <p class="community-block-subtitle">
        LOG IN TO SEE STORIES, SHARE RECIPES, AND CONNECT WITH FELLOW COFFEE & MATCHA LOVERS.
      </p>
      <div class="community-block-actions">
        <button class="community-block-btn" (click)="openLoginModal()">LOG IN</button>
        <button class="community-block-btn-outline" (click)="goHome()">MAYBE LATER</button>
      </div>
    </div>
  </div>
</div>

<app-create-post-modal *ngIf="showCreatePost" (close)="closeCreatePost()"></app-create-post-modal>
<app-create-recipe-modal *ngIf="showCreateRecipe" (close)="closeCreateRecipe()"></app-create-recipe-modal>

<app-share-modal *ngIf="showShareModal" [shareUrl]="shareUrl" (close)="closeShareModal()"></app-share-modal>

<app-back-to-top></app-back-to-top>
