<div class="modal-backdrop" *ngIf="isOpen" (click)="onCancel()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <button type="button" class="close-btn" (click)="onCancel()" aria-label="Close modal">
      <svg lucideX [size]="24"></svg>
    </button>

    <header class="modal-header">
      <h2 class="modal-title">Delete Address</h2>
      <p class="confirm-desc">Are you sure you want to delete this address?</p>
      <p class="warning-desc">This action cannot be undone.</p>
    </header>

    <div class="modal-body" *ngIf="address">
      <div class="address-details-card">
        <div class="detail-group">
          <span class="detail-label">RECIPIENT</span>
          <span class="detail-value">{{ address.recipient_name }}</span>
        </div>
        <div class="detail-group">
          <span class="detail-label">PHONE</span>
          <span class="detail-value">{{ address.phone }}</span>
        </div>
        <div class="detail-group">
          <span class="detail-label">{{ (address.label || 'Other') | uppercase }}</span>
          <span class="detail-value">{{ address.detail_address }}, {{ address.city }}</span>
        </div>
      </div>
    </div>

    <footer class="modal-footer">
      <button type="button" class="btn-modal btn-cancel" (click)="onCancel()">CANCEL</button>
      <button type="button" class="btn-modal btn-delete" (click)="onConfirm()">DELETE</button>
    </footer>
  </div>
</div>
