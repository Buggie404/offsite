<div class="modal-backdrop" *ngIf="isOpen" (click)="onCancel()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <header class="modal-header">
      <h3 class="modal-title">{{ address ? 'Edit Address' : 'Add New Address' }}</h3>
      <button type="button" class="close-btn" (click)="onCancel()" aria-label="Close modal">
        <svg lucideX [size]="22"></svg>
      </button>
    </header>

    <div class="modal-body">
      <!-- Recipient Name -->
      <div class="form-field">
        <label class="field-label">RECIPIENT NAME <span class="required-star">*</span></label>
        <div class="input-wrapper">
          <input type="text" class="form-input" placeholder="Enter name" [(ngModel)]="form.recipient_name"
            (blur)="onFieldBlur('name'); form.recipient_name = form.recipient_name.trimStart()"
            (input)="onFieldInput('name')" [class.has-error]="nameError()"
            [class.is-valid]="fieldStates()['name'] === 'valid'"
            [class.is-typing]="fieldStates()['name'] === 'typing'" />
          <div class="status-indicator" [ngSwitch]="fieldStates()['name']">
            <span *ngSwitchCase="'typing'" class="typing-dot"></span>
            <svg *ngSwitchCase="'valid'" lucideCheck class="icon-valid" [size]="16"></svg>
            <svg *ngSwitchCase="'invalid'" lucideAlertCircle class="icon-invalid" [size]="16"></svg>
          </div>
        </div>
        <div *ngIf="nameError()" class="field-error animate-fade-in">
          {{ nameError() }}
        </div>
      </div>

      <!-- Phone Number -->
      <div class="form-field">
        <label class="field-label">PHONE NUMBER <span class="required-star">*</span></label>
        <div class="input-wrapper">
          <input type="tel" class="form-input" placeholder="e.g., 0123456789" [(ngModel)]="form.phone"
            (blur)="onFieldBlur('mobile')" (input)="onFieldInput('mobile')" [class.has-error]="mobileError()"
            [class.is-valid]="fieldStates()['mobile'] === 'valid'"
            [class.is-typing]="fieldStates()['mobile'] === 'typing'" />
          <div class="status-indicator" [ngSwitch]="fieldStates()['mobile']">
            <span *ngSwitchCase="'typing'" class="typing-dot"></span>
            <svg *ngSwitchCase="'valid'" lucideCheck class="icon-valid" [size]="16"></svg>
            <svg *ngSwitchCase="'invalid'" lucideAlertCircle class="icon-invalid" [size]="16"></svg>
          </div>
        </div>
        <div *ngIf="mobileError()" class="field-error animate-fade-in">
          {{ mobileError() }}
        </div>
      </div>

      <!-- City -->
      <div class="form-field select-suggest-wrapper">
        <label class="field-label">CITY / PROVINCE <span class="required-star">*</span></label>
        <div class="input-wrapper">
          <input type="text" class="form-input" placeholder="Recipient City" [(ngModel)]="form.city"
            (blur)="onCityBlur()" (input)="onCityInput()" [class.has-error]="cityError()"
            [class.is-valid]="fieldStates()['city'] === 'valid'" [class.is-typing]="fieldStates()['city'] === 'typing'"
            autocomplete="off" />
          <div class="status-indicator" [ngSwitch]="fieldStates()['city']">
            <span *ngSwitchCase="'typing'" class="typing-dot"></span>
            <svg *ngSwitchCase="'valid'" lucideCheck class="icon-valid" [size]="16"></svg>
            <svg *ngSwitchCase="'invalid'" lucideAlertCircle class="icon-invalid" [size]="16"></svg>
          </div>
        </div>
        <div *ngIf="showCitySuggestions && citySuggestions.length > 0" class="suggestions-panel">
          <button type="button" *ngFor="let suggest of citySuggestions" (mousedown)="selectCity(suggest)">
            {{ suggest }}
          </button>
        </div>
        <div *ngIf="cityError()" class="field-error animate-fade-in">
          {{ cityError() }}
        </div>
      </div>

      <!-- Detailed Address -->
      <div class="form-field">
        <label class="field-label">DETAILED ADDRESS <span class="required-star">*</span></label>
        <div class="input-wrapper">
          <textarea class="form-textarea" placeholder="House Number Street, Ward" rows="3"
            [(ngModel)]="form.detail_address" (blur)="onFieldBlur('address')" (input)="onFieldInput('address')"
            [class.has-error]="addressError()" [class.is-valid]="fieldStates()['address'] === 'valid'"
            [class.is-typing]="fieldStates()['address'] === 'typing'"></textarea>
          <div class="status-indicator status-indicator--textarea" [ngSwitch]="fieldStates()['address']">
            <span *ngSwitchCase="'typing'" class="typing-dot"></span>
            <svg *ngSwitchCase="'valid'" lucideCheck class="icon-valid" [size]="16"></svg>
            <svg *ngSwitchCase="'invalid'" lucideAlertCircle class="icon-invalid" [size]="16"></svg>
          </div>
        </div>
        <div *ngIf="addressError()" class="field-error animate-fade-in">
          {{ addressError() }}
        </div>
      </div>

      <!-- Address Label -->
      <div class="form-field">
        <label class="field-label">ADDRESS LABEL</label>
        <div class="label-button-group">
          <button type="button" class="label-btn" [class.active]="form.label === 'home'" (click)="selectLabel('home')">
            HOME
          </button>
          <button type="button" class="label-btn" [class.active]="form.label === 'office'"
            (click)="selectLabel('office')">
            OFFICE
          </button>
          <button type="button" class="label-btn" [class.active]="form.label === 'other'"
            (click)="selectLabel('other')">
            OTHER
          </button>
        </div>
      </div>

      <!-- Set as Default -->
      <div class="form-field form-field--checkbox">
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="form.is_default" [disabled]="isOnlyAddress" />
          <span>Set as default address</span>
        </label>
      </div>
    </div>

    <footer class="modal-footer">
      <button type="button" class="btn btn-cancel" (click)="onCancel()">CANCEL</button>
      <button type="button" class="btn btn-save" (click)="onSave()">SAVE ADDRESS</button>
    </footer>
  </div>
</div>
