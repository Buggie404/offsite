<div class="admin-app">
  <aside class="admin-sidebar">
    <nav class="sidebar-nav" aria-label="Admin navigation">
      <span class="sidebar-nav__label">Order Management</span>
      <a
        routerLink="/admin/orders"
        class="sidebar-link"
        [class.sidebar-link--active]="ordersLinkActive"
        (click)="onOrdersLinkClick($event)"
      >
        <svg lucidePackage aria-hidden="true" [size]="18"></svg>
        Orders
      </a>
    </nav>

    <div class="sidebar-footer">
      <button type="button" class="sidebar-sign-out" (click)="openSignOutModal()">
        <svg lucideLogOut aria-hidden="true" [size]="16"></svg>
        Sign out
      </button>
      <p>Offsite Admin · v1.0</p>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <a routerLink="/admin/orders" class="logo-lockup--header" aria-label="Offsite Admin home">
        <img
          src="assets/images/abs_logo_dark.png"
          alt=""
          class="logo-mark-img"
          width="40"
          height="40"
        />
        <div class="logo-text">
          <span class="wordmark">Offsite</span>
          <span class="slogan">Your café, at home.</span>
        </div>
      </a>

      <div class="header-search">
        <svg lucideSearch class="header-search__icon" aria-hidden="true" [size]="18"></svg>
        <input
          type="search"
          class="header-search__input"
          placeholder="Search orders, customers, order ID…"
          aria-label="Search orders"
          [value]="searchQuery"
          (input)="onSearchInput($any($event.target).value)"
        />
      </div>

      <div class="header-actions">
        <button type="button" class="btn btn-ghost" aria-label="Notifications">
          <svg lucideBell aria-hidden="true" [size]="18"></svg>
        </button>
        <div class="header-avatar" [attr.aria-label]="'Signed in as ' + avatarInitials">
          {{ avatarInitials }}
        </div>
      </div>
    </header>

    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

@if (showSignOutModal) {
  <div class="sign-out-overlay" (click)="closeSignOutModal()" role="presentation">
    <div
      class="sign-out-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sign-out-modal-title"
      (click)="$event.stopPropagation()"
    >
      <button
        type="button"
        class="sign-out-modal__close"
        (click)="closeSignOutModal()"
        aria-label="Close dialog"
      >
        <svg lucideX aria-hidden="true" [size]="18"></svg>
      </button>

      <div class="sign-out-modal__icon-wrap" aria-hidden="true">
        <svg lucideLogOut class="sign-out-modal__icon" [size]="22"></svg>
      </div>

      <h2 id="sign-out-modal-title" class="sign-out-modal__title">Signing out?</h2>
      <p class="sign-out-modal__message">
        Any unsaved changes will be saved to your drafts before you leave.
      </p>

      <div class="sign-out-modal__actions">
        <button type="button" class="sign-out-modal__btn sign-out-modal__btn--primary" (click)="confirmSignOut()">
          <svg lucideLogOut aria-hidden="true" [size]="16"></svg>
          Sign out
        </button>
        <button type="button" class="sign-out-modal__btn sign-out-modal__btn--secondary" (click)="closeSignOutModal()">
          Stay
        </button>
      </div>
    </div>
  </div>
}
